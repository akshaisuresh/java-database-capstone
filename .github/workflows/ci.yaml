name: SmartCare Backend CI

# Automatically triggered on push or pull request events
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    name: Build & Test (Java + Maven)
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Java 21 with Maven
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Compile the Spring Boot application using Maven
      - name: Build with Maven
        working-directory: backend
        run: mvn clean compile -B

      # 4. Run unit and integration tests
      - name: Run tests
        working-directory: backend
        run: mvn test -B

      # 5. Package the JAR (skip tests – already run above)
      - name: Package JAR
        working-directory: backend
        run: mvn package -DskipTests -B

      # 6. Upload build artefact for inspection
      - name: Upload JAR artefact
        uses: actions/upload-artifact@v4
        with:
          name: smartcare-backend
          path: backend/target/*.jar

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: backend
        run: docker build -t smartcare-backend:${{ github.sha }} .
