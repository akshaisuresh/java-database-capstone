<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doctor Login – SmartCare</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #004d40 0%, #00695c 60%, #00897b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 48px 40px;
      width: 400px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.25);
    }
    .logo { text-align: center; margin-bottom: 8px; }
    .logo svg { width: 56px; height: 56px; }
    h1 { text-align: center; font-size: 1.6rem; color: #004d40; margin-bottom: 4px; }
    .subtitle { text-align: center; color: #777; font-size: 0.9rem; margin-bottom: 32px; }
    .badge {
      display: block;
      background: #e0f2f1;
      color: #00695c;
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-align: center;
      width: fit-content;
      margin: 0 auto 24px;
    }
    label { display: block; font-size: 0.85rem; color: #444; margin-bottom: 6px; font-weight: 500; }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      transition: border-color 0.2s;
      margin-bottom: 20px;
    }
    input:focus { outline: none; border-color: #00897b; }
    button {
      width: 100%;
      padding: 13px;
      background: #004d40;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #00695c; }
    .links { text-align: center; margin-top: 18px; font-size: 0.85rem; color: #888; }
    .error { color: #c62828; font-size: 0.85rem; margin-bottom: 12px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="28" cy="28" r="28" fill="#004d40"/>
        <path d="M28 14v28M14 28h28" stroke="white" stroke-width="5" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>SmartCare</h1>
    <div class="subtitle">Clinic Management System</div>
    <span class="badge">🩺 Doctor Portal</span>

    <p class="error" id="errorMsg">Invalid credentials. Please try again.</p>

    <label for="email">Doctor Email</label>
    <input type="email" id="email" placeholder="doctor@smartcare.com" />

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••" />

    <button onclick="login()">Sign In as Doctor</button>

    <div class="links">
      <a href="../admin/login.html">Admin Portal</a> &nbsp;|&nbsp;
      <a href="../patient/login.html">Patient Portal</a>
    </div>
  </div>

  <script>
    async function login() {
      const email    = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errEl    = document.getElementById('errorMsg');
      errEl.style.display = 'none';

      try {
        const res = await fetch('http://localhost:8080/api/doctors/login', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok && data.token) {
          localStorage.setItem('token',    data.token);
          localStorage.setItem('role',     'DOCTOR');
          localStorage.setItem('doctorId', data.doctorId);
          window.location.href = 'dashboard.html';
        } else {
          errEl.style.display = 'block';
        }
      } catch {
        errEl.textContent = 'Server unreachable. Check backend.';
        errEl.style.display = 'block';
      }
    }
  </script>
</body>
</html>
