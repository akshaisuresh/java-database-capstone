<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doctor Dashboard – SmartCare</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f5f3; }
    .sidebar {
      width: 240px; position: fixed; top: 0; left: 0; height: 100vh;
      background: #004d40; color: #fff; padding: 24px 0;
    }
    .sidebar .brand { padding: 0 24px 24px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .sidebar nav a {
      display: block; padding: 13px 24px; color: rgba(255,255,255,0.8);
      text-decoration: none; font-size: 0.92rem; transition: background 0.15s;
    }
    .sidebar nav a:hover { background: rgba(255,255,255,0.12); color: #fff; }
    .main { margin-left: 240px; padding: 32px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
    .topbar h1 { font-size: 1.5rem; color: #004d40; }
    .panel {
      background: #fff; border-radius: 12px; padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07); margin-bottom: 24px;
    }
    .panel h2 { font-size: 1.1rem; color: #004d40; margin-bottom: 20px; }
    .filter-row { display: flex; gap: 12px; margin-bottom: 20px; align-items: flex-end; }
    .filter-row label { font-size: 0.82rem; color: #555; font-weight: 500; display: block; margin-bottom: 5px; }
    .filter-row input {
      padding: 9px 12px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 0.9rem;
    }
    .btn { padding: 9px 20px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .btn-green { background: #004d40; color: #fff; }
    .btn-green:hover { background: #00695c; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 10px 12px; font-size: 0.8rem;
         text-transform: uppercase; color: #888; border-bottom: 2px solid #f0f5f3; }
    td { padding: 12px; font-size: 0.9rem; border-bottom: 1px solid #f5f5f5; }
    .status {
      display: inline-block; padding: 3px 10px; border-radius: 20px;
      font-size: 0.75rem; font-weight: 600;
    }
    .status.CONFIRMED  { background: #e8f5e9; color: #2e7d32; }
    .status.PENDING    { background: #fff8e1; color: #f57f17; }
    .status.CANCELLED  { background: #ffebee; color: #c62828; }
    .status.COMPLETED  { background: #e3f2fd; color: #1565c0; }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <h2>SmartCare</h2>
      <small>Doctor Portal</small>
    </div>
    <nav>
      <a href="#">My Appointments</a>
      <a href="#">Availability</a>
      <a href="#">Prescriptions</a>
      <a href="#" onclick="logout()">Logout</a>
    </nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>My Patient Appointments</h1>
      <span style="color:#888;font-size:0.9rem;" id="doctorName">Loading...</span>
    </div>

    <div class="panel">
      <h2>📅 All Appointments</h2>
      <div class="filter-row">
        <div>
          <label>Filter by Date</label>
          <input type="date" id="filterDate" />
        </div>
        <button class="btn btn-green" onclick="loadAppointments()">Filter</button>
        <button class="btn" style="background:#eee;" onclick="clearFilter()">Clear</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Patient Name</th>
            <th>Date &amp; Time</th>
            <th>Status</th>
            <th>Notes</th>
          </tr>
        </thead>
        <tbody id="apptBody">
          <tr><td colspan="5" style="color:#aaa;text-align:center;padding:20px;">Loading appointments...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    const token    = localStorage.getItem('token');
    const doctorId = localStorage.getItem('doctorId');
    if (!token) window.location.href = 'login.html';

    async function loadAppointments() {
      const tbody   = document.getElementById('apptBody');
      tbody.innerHTML = '<tr><td colspan="5" style="color:#aaa;text-align:center;">Loading...</td></tr>';

      try {
        const res  = await fetch(`http://localhost:8080/api/appointments/doctor/${doctorId}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        let appts = await res.json();

        const dateFilter = document.getElementById('filterDate').value;
        if (dateFilter) {
          appts = appts.filter(a => a.appointmentTime.startsWith(dateFilter));
        }

        if (!appts.length) {
          tbody.innerHTML = '<tr><td colspan="5" style="color:#aaa;text-align:center;padding:20px;">No appointments found.</td></tr>';
          return;
        }

        tbody.innerHTML = appts.map((a, i) => `
          <tr>
            <td>${i + 1}</td>
            <td>${a.patient?.fullName || '–'}</td>
            <td>${new Date(a.appointmentTime).toLocaleString()}</td>
            <td><span class="status ${a.status}">${a.status}</span></td>
            <td>${a.notes || '–'}</td>
          </tr>`).join('');
      } catch {
        tbody.innerHTML = '<tr><td colspan="5" style="color:#e53935;text-align:center;padding:20px;">Failed to load. Is the backend running?</td></tr>';
      }
    }

    function clearFilter() {
      document.getElementById('filterDate').value = '';
      loadAppointments();
    }

    function logout() { localStorage.clear(); window.location.href = 'login.html'; }

    loadAppointments();
  </script>
</body>
</html>
