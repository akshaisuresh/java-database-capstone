# ── Server ─────────────────────────────────────────────────────────────────
server.port=8080

# ── MySQL DataSource ────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/smartcare?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── MongoDB ─────────────────────────────────────────────────────────────────
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/smartcare}

# ── JWT ─────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:smartcare-super-secret-key-change-in-production-2025}

# ── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.smartcare=DEBUG
