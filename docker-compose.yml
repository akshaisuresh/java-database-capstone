version: '3.9'

services:

  # ── MySQL ─────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: smartcare-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smartcare
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MongoDB ────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: smartcare-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # ── Spring Boot Backend ────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartcare-backend
    ports:
      - "8080:8080"
    environment:
      DB_USERNAME: root
      DB_PASSWORD: root
      MONGO_URI: mongodb://mongodb:27017/smartcare
      JWT_SECRET: smartcare-super-secret-key-change-in-production-2025
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smartcare?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_started
    restart: on-failure

volumes:
  mysql-data:
  mongo-data:
